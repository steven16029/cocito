apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-frontend
  namespace: erp-international
  labels:
    app: erp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-frontend
  template:
    metadata:
      labels:
        app: erp-frontend
    spec:
      containers:
      - name: erp-frontend-container
        image: quay.io/mi-organizacion/erp-frontend:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: erp-frontend-service
  namespace: erp-international
  labels:
    app: erp-frontend
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: erp-frontend
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: erp-frontend-route
  namespace: erp-international
  labels:
    app: erp-frontend
spec:
  to:
    kind: Service
    name: erp-frontend-service
  port:
    targetPort: 8080
  tls:
    termination: edge
